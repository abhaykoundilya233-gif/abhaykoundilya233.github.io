media:
  input: media
  output: /media
  rename: safe
  categories: [image]

content:
  - name: articles
    label: Research articles
    type: file
    path: data/articles.json
    format: json
    list: true
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Use lowercase letters, numbers and hyphens only. Example: early-medieval-inscriptions"
      - name: category
        label: Subject
        type: select
        options:
          values:
            - Archaeology
            - Inscriptions
            - Manuscripts
            - Coins
            - Architecture
            - Art & Iconography
      - name: excerpt
        label: Short summary
        type: text
      - name: coverUrl
        label: Cover image
        type: image
      - name: createdAt
        label: Publication date
        type: date
      - name: status
        label: Publication status
        type: select
        options:
          values:
            - draft
            - published
      - name: content
        label: Article content
        type: rich-text
        required: true
